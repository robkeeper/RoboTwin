defaults:
  - env/robotwin_adjust_bottle@env.eval
  - model/pi0_5@rollout.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: /workspace/ctr_backup/open_laptop_eval/unconfigured
    project_name: rlinf
    experiment_name: open_laptop_pi05
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  enable_offload: false
  eval:
    seed: 20261103
    rollout_epoch: 4
    total_num_envs: 1
    group_size: 1
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: false
    max_episode_steps: 700
    max_steps_per_rollout_epoch: 700
    is_eval: true
    assets_path: /workspace/RoboTwin
    seeds_path: /workspace/ctr_backup/open_laptop_eval/success_seeds.json
    center_crop: false
    skip_intermediate_renders: true
    video_cfg:
      save_video: false
      video_base_dir: /workspace/ctr_backup/open_laptop_eval/video
    task_config:
      task_name: open_laptop
      step_lim: 700
      action_execution_mode: take_action
      planner_backend: mplib
      embodiment: [aloha-agilex]
      render_freq: 0
      collect_data: false
      save_data: false
      clear_cache_freq: 1
      camera:
        head_camera_type: D435
        wrist_camera_type: D435
        collect_head_camera: true
        collect_wrist_camera: true
      data_type:
        rgb: true
        qpos: true
        depth: false
        pointcloud: false
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  seed: 20261103
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  # Model fields are loaded from each checkpoint's rlinf_model.yaml.
